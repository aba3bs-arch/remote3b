<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sesion remota - Remote3B</title>
    <link rel="stylesheet" href="/assets/session.css" />
  </head>
  <body>
    <main class="session-shell">
      <section class="remote-stage" aria-label="Pantalla remota">
        <div class="browser-frame">
          <div class="browser-tabs">
            <span class="browser-dot"></span>
            <span class="browser-dot"></span>
            <span class="tab-title">Usuario</span>
          </div>
          <div class="remote-app">
            <div class="remote-sidebar"></div>
            <div class="remote-content">
              <div class="remote-header"></div>
              <div class="remote-line wide"></div>
              <div class="remote-line"></div>
              <div class="remote-grid">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="operator-toolbar" id="operatorToolbar" aria-label="Barra local del operador">
        <div class="toolbar-main">
          <div class="toolbar-device">
            <span class="brand-ring" aria-hidden="true"></span>
            <button class="device-button" id="deviceButton" type="button">
              <span id="deviceName">Equipo conectado</span>
              <span aria-hidden="true">v</span>
            </button>
          </div>

          <div class="toolbar-actions" aria-label="Herramientas de sesion">
            <button type="button" title="Monitor remoto">PC</button>
            <button type="button" title="Informacion">i</button>
            <button type="button" title="Audio">Vol</button>
            <button type="button" title="Pantalla completa">Full</button>
            <button type="button" title="Video">Vid</button>
            <button type="button" title="Chat">Chat</button>
            <button type="button" title="Anotar">Pen</button>
            <button type="button" title="Zoom">Zoom</button>
            <button type="button" title="Captura">Cam</button>
            <button type="button" title="Archivos">File</button>
            <button type="button" title="Teclado">Keys</button>
            <button type="button" title="Vista">View</button>
            <button type="button" title="Ayuda">?</button>
          </div>

          <button class="collapse-button" id="collapseButton" type="button" aria-expanded="true">
            <span class="collapse-icon" aria-hidden="true"></span>
            <span class="sr-only">Ocultar barra</span>
          </button>
        </div>

        <div class="device-menu" id="deviceMenu" hidden>
          <button type="button">Cambiar equipo</button>
          <button type="button">Calidad: Automatica</button>
          <button type="button">Finalizar sesion</button>
        </div>
      </section>

      <button class="restore-tab" id="restoreTab" type="button" hidden>
        Mostrar barra
      </button>

      <aside class="operator-note">
        Esta barra pertenece al panel del operador. No se dibuja dentro de la pantalla remota.
      </aside>
    </main>

    <script src="/assets/session.js"></script>
  </body>
</html>
